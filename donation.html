<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#5f259f">

    <title>Donate - Yireh Ministry</title>

    <style>
        /* ==============================
           GLOBAL STYLES
        ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 16px;

            font-family: Arial, Helvetica, sans-serif;

            background: #f7f4fb;
            color: #29252f;

            overflow-x: hidden;
        }

        /* ==============================
           DONATION CONTAINER
        ============================== */

        .donation-container {
            width: 100%;
            max-width: 460px;

            padding: 28px;

            background: #ffffff;

            border: 1px solid #eee7f5;
            border-radius: 20px;

            box-shadow:
                0 12px 40px rgba(50, 20, 80, 0.09);

            text-align: center;
        }

        /* ==============================
           HEADING
        ============================== */

        .donation-container h1 {
            margin-bottom: 12px;

            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(25px, 5vw, 32px);
            font-weight: 400;

            line-height: 1.3;
            color: #29252f;
        }

        .donation-description {
            max-width: 340px;

            margin: 0 auto 24px;

            color: #716b79;

            font-size: 14px;
            line-height: 1.7;
        }

        /* ==============================
           PHONEPE QR IMAGE
        ============================== */

        .qr-wrapper {
            width: 100%;
            max-width: 380px;

            margin: 0 auto;

            overflow: hidden;

            background: #ffffff;

            border: 1px solid #eeeaf2;
            border-radius: 12px;
        }

        .qr-image {
            display: block;

            width: 100%;
            height: auto;

            object-fit: contain;
        }

        /* ==============================
           FOOTER MESSAGE
        ============================== */

        .thank-you {
            margin-top: 22px;

            color: #5f259f;

            font-size: 15px;
            font-weight: 600;

            line-height: 1.6;
        }

        .payment-note {
            margin-top: 8px;

            color: #77717f;

            font-size: 12px;
            line-height: 1.6;
        }

        /* ==============================
           TABLET
        ============================== */

        @media (max-width: 768px) {

            body {
                padding: 24px 16px;
            }

            .donation-container {
                max-width: 430px;
                padding: 24px;
            }

            .qr-wrapper {
                max-width: 360px;
            }
        }

        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 480px) {

            body {
                padding: 16px 12px;
            }

            .donation-container {
                padding: 20px 16px;
                border-radius: 16px;
            }

            .donation-container h1 {
                font-size: 27px;
            }

            .donation-description {
                font-size: 13px;
                margin-bottom: 20px;
            }

            .qr-wrapper {
                max-width: 100%;
                border-radius: 10px;
            }

            .thank-you {
                font-size: 14px;
            }
        }

        /* ==============================
           SMALL MOBILE
        ============================== */

        @media (max-width: 360px) {

            body {
                padding: 12px 8px;
            }

            .donation-container {
                padding: 16px 12px;
            }

            .donation-container h1 {
                font-size: 24px;
            }

            .donation-description {
                font-size: 12px;
            }

            .thank-you {
                font-size: 13px;
            }
        }

    </style>
</head>

<body>

    <main class="donation-container">

        <!-- PAGE HEADING -->

        <h1>Support Yireh Ministry</h1>

        <p class="donation-description">
            Your generous contribution helps us continue
            our ministry and serve the community.
        </p>

        <!-- PHONEPE QR CODE -->

        <div class="qr-wrapper">

            <img
                src="assets/qr.jpeg"
                alt="PhonePe donation QR code for Yireh Ministry"
                class="qr-image"
            >

        </div>

        <!-- THANK YOU MESSAGE -->

        <p class="thank-you">
            Thank you for supporting Yireh Ministry!
        </p>

        <p class="payment-note">
            Scan the QR code using PhonePe or any
            compatible UPI app to make your donation.
        </p>

    </main>


</body>

</html>
